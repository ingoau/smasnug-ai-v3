# Slack app manifest for smasnug-ai. Create the app at https://api.slack.com/apps → "Create New App" →
# "From a manifest", paste this file. See docs/slack-setup.md for tokens and .env.
display_information:
  name: smasnug ai v3
  description: Workspace assistant — answers, researches in the background, sends messages on your behalf.
  background_color: "#2c2d30"
  long_description: >-
    smasnug ai v3 is a workspace Slack agent. Mention it in a thread or DM it: it replies, reacts, delegates longer
    research to background subagents shown in plan cards, and can send messages on your behalf after you confirm a
    preview. It remembers a few facts about you to personalise answers; the App Home tab lists them and lets you
    delete them at any time. Channel creators can turn it off in their channel with /smasnug off.
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: smasnug ai v3
    always_online: true
  # Agents & AI Apps: the agent container (split view next to any channel) with a native stop button.
  agent_view:
    agent_description: >-
      smasnug ai v3 is the Hack Club workspace assistant. Ask it anything, have it dig through channels and the web in the
      background, summarise threads, or draft and send messages on your behalf after you confirm.
    suggested_prompts:
      - title: Catch me up
        message: Summarise what's been happening in the channel I'm looking at.
      - title: Where should I hang out?
        message: Which channels should I join to get help with my project and to show off what I've built?
      - title: Project ideas
        message: Give me a few beginner-friendly project ideas I could build and ship this weekend.
      - title: What can you do?
        message: What can you help me with, briefly?
  slash_commands:
    - command: /smasnug
      description: Turn smasnug ai v3 off or on in this channel, or show its status
      usage_hint: "off | on | status"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write            # post, stream, update; agents.sessions.setStatus (status + stop button)
      - assistant:write       # Agents & AI Apps: app_context_changed, suggested prompts, session titles
      - chat:write.customize  # "smasnug ai v3 on behalf of <user>" username + avatar
      - chat:write.public     # send to public channels the bot hasn't joined
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - im:write              # conversations.open for on-behalf DMs
      - users:read
      - reactions:read
      - reactions:write
      - files:read
      - files:write
      - channels:join         # join public channels when posting needs membership
      - commands              # /smasnug
      - emoji:read
    user:
      - search:read           # Slack search (user token, public channels only — enforced in code)
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - app_home_opened
      - app_context_changed          # what the user is viewing while the agent container is open
      - agent_session_stopped        # native stop button
      - agent_session_title_changed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
