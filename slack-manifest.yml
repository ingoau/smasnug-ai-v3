# Slack app manifest for smasnug-ai. Create the app at https://api.slack.com/apps → "Create New App" →
# "From a manifest", paste this file. See docs/slack-setup.md for tokens and .env.
# The dev app (A0C6FBD1KL2) is this file with name "dev - smasnug ai v3", bot display name "dev - smasnug ai" and
# the slash command /smasnug-dev.
display_information:
  name: smasnug ai v3
  description: agentic ai b2b saas
  background_color: "#2c2d30"
features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
    agent_tasks_enabled: true
  bot_user:
    display_name: smasnug ai
    always_online: true
  # Agents & AI Apps: the agent container (split view next to any channel). No native stop button: the app doesn't
  # subscribe to agent_session_stopped (accidental clicks); `@bot !stop` stops a response instead.
  agent_view:
    agent_description: agentic ai b2b saas
    suggested_prompts: []
  slash_commands:
    - command: /smasnug
      description: Turn the bot on or off in this channel
      usage_hint: "off | on | status"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write            # post, stream, update; agents.sessions.setStatus (status)
      - assistant:write       # Agents & AI Apps: app_context_changed, suggested prompts, session titles
      - chat:write.customize  # "smasnug ai on behalf of <user>" username + avatar
      - chat:write.public     # send to public channels the bot hasn't joined
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - im:write              # conversations.open for on-behalf DMs
      - users:read
      - reactions:read
      - reactions:write
      - files:read
      - files:write
      - channels:join         # join public channels when posting needs membership
      - commands              # /smasnug
      - emoji:read
      - canvases:read         # read_canvas: canvases.getContent (access rule enforced in code: own / this conversation / public)
      - canvases:write        # create_canvas / edit_canvas: canvases.create, canvases.edit, canvases.access.set (bot's own canvases only)
    user:
      - search:read           # Slack search (user token, public channels only — enforced in code)
      - channels:history      # read_public_thread only: open public-channel threads found via search (verified public in code)
      - search:read.public    # slack_semantic_search: Real-time Search (assistant.search.context), public channels only; user token so no action_token is needed
  pkce_enabled: false
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - app_home_opened
      - app_context_changed          # what the user is viewing while the agent container is open
      - agent_session_title_changed  # user renamed a session: never overwritten (DM titles)
      - reaction_added               # reactions shown in context (messages.reactions); never start a turn
      - reaction_removed
      # Workspace directory (src/tools/directory/): live profile + public-channel updates. users:read / channels:read
      # cover them (no new scopes). Topic / purpose changes arrive as message.channels subtypes.
      - user_change
      - team_join
      - channel_created
      - channel_rename
      - channel_archive
      - channel_unarchive
      - channel_deleted
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
  app_level_token_rotation_enabled: false
  is_mcp_enabled: false
