services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: smasnug
      POSTGRES_PASSWORD: smasnug
      POSTGRES_DB: smasnug
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
volumes:
  pgdata:
